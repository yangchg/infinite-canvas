log_format provider_relay escape=json '{"requestId":"$request_id","status":$status,"elapsedSeconds":$request_time,"relayAddress":"$upstream_addr","relayStatus":"$upstream_status","relayOrigin":"$upstream_http_x_canvas_relay_origin","relaySeconds":"$upstream_response_time"}';
server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location ^~ /api/model-gateway/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        client_max_body_size 100m;
        client_body_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        send_timeout 300s;
        proxy_next_upstream off;
        proxy_buffering off;
        proxy_cache off;
    }

    location ^~ /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        client_max_body_size 100m;
        proxy_next_upstream off;
        proxy_cache off;
    }

    # Fixed upstream only. The trailing slash strips /relay/provider/ exactly once.
    location ^~ /relay/provider/ {
        # Windows loopback relay performs verified HTTPS to the one fixed provider.
        # Docker also resolves an IPv6 address that cannot reach the Windows relay.
        resolver 127.0.0.11 ipv6=off;
        set $provider_relay http://host.docker.internal:17373;
        rewrite ^/relay/provider/(.*)$ /$1 break;
        proxy_pass $provider_relay;
        proxy_http_version 1.1;
        proxy_set_header Host api.niumatoken.com;
        proxy_set_header Connection "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Canvas-Request-Id $request_id;
        # Let nginx preserve Content-Type (including multipart boundary) and body bytes.
        proxy_set_header Cookie "";
        proxy_set_header Origin "";
        proxy_set_header Referer "";

        client_max_body_size 100m;
        client_body_timeout 300s;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        send_timeout 300s;
        proxy_next_upstream off;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_ignore_headers X-Accel-Buffering;
        proxy_cache off;
        proxy_intercept_errors off;
        gzip off;
        # Never persist Authorization, prompts, or query-string credentials in logs.
        access_log /var/log/nginx/provider-relay.log provider_relay;
        error_log /dev/null;
    }

# Add inside the existing local Nginx server block, then nginx -t and reload.
location ^~ /notifications/dingtalk/ {
    resolver 127.0.0.11 ipv6=off;
    set $dingtalk_notify http://host.docker.internal:17374;
    rewrite ^/notifications/dingtalk/(.*)$ /$1 break;
    proxy_pass $dingtalk_notify;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_next_upstream off;
    proxy_cache off;
    access_log off;
}

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 运行期配置由容器启动时生成，禁止缓存，确保改环境变量后即时生效。
    location = /config.js {
        add_header Cache-Control "no-store";
    }
}

