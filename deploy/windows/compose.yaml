name: infinite-canvas-stable
services:
  app:
    image: infinite-canvas:dingtalk-working-local
    build:
      context: ../..
      dockerfile: deploy/windows/Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
      - "${CANVAS_LAN_IP:?Set CANVAS_LAN_IP in deploy/windows/.env}:3000:3000"
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
  backend:
    image: infinite-canvas:accounts-backend-local
    build:
      context: ../..
      dockerfile: server/Dockerfile
    environment:
      APP_ORIGINS: http://localhost:3000,http://${CANVAS_LAN_IP}:3000
      TRUST_PROXY: "1"
      DINGTALK_NOTIFY_URL: http://app:3000/notifications/dingtalk
    volumes:
      - ../../data/canvas-server:/app/data
    restart: unless-stopped
