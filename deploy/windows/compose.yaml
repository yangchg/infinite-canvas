name: infinite-canvas-stable
services:
  app:
    image: infinite-canvas:dingtalk-working-local
    build:
      context: ../..
      dockerfile: deploy/windows/Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
      - "${CANVAS_LAN_IP:?Set CANVAS_LAN_IP in deploy/windows/.env}:3000:3000"
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
