# Add inside the existing local Nginx server block, then nginx -t and reload.
location ^~ /notifications/dingtalk/ {
    resolver 127.0.0.11 ipv6=off;
    set $dingtalk_notify http://host.docker.internal:17374;
    rewrite ^/notifications/dingtalk/(.*)$ /$1 break;
    proxy_pass $dingtalk_notify;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_next_upstream off;
    proxy_cache off;
    access_log off;
}
